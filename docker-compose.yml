version: '3.8'

services:

  # ── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hng-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hng-nginx-logs:/var/log/nginx          # writes logs here
    depends_on:
      - nextcloud
    networks:
      - hng-net

  # ── Nextcloud (pre-built HNG image) ─────────────────────────
  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    environment:
      - SQLITE_DATABASE=${SQLITE_DATABASE}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
    volumes:
      - nextcloud-data:/var/www/html
      - hng-nginx-logs:/var/log/nginx:ro       # reads logs (read-only)
    networks:
      - hng-net

  # ── Your detector daemon (placeholder for now) ───────────────
  detector:
    image: python:3.11-slim
    container_name: hng-detector
    restart: unless-stopped
    command: >
      sh -c "pip install flask pyyaml requests psutil &&
             python3 /app/main.py"
    volumes:
      - ./detector:/app                        # your Python code
      - hng-nginx-logs:/var/log/nginx:ro       # reads logs (read-only)
    working_dir: /app
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN

# ── Named volume shared across all three containers ───────────
volumes:
  hng-nginx-logs:
    name: HNG-nginx-logs
  nextcloud-data:

# ── Internal network ──────────────────────────────────────────
networks:
  hng-net:
    driver: bridge
