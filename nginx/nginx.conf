events {
    worker_connections 1024;
}

http {
    # Define JSON log format - this is what your detector will parse
    log_format json_combined escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    # Tell Nginx to trust X-Forwarded-For from these sources
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80;
        server_name _;

        # Write JSON logs to the shared volume path
        access_log /var/log/nginx/hng-access.log json_combined;
        error_log  /var/log/nginx/error.log warn;

        # Forward everything to Nextcloud
        location / {
            proxy_pass         http://nextcloud:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Needed for Nextcloud large file uploads
            proxy_read_timeout        300;
            proxy_connect_timeout     300;
            proxy_send_timeout        300;
            client_max_body_size      10G;
        }
    }
}
